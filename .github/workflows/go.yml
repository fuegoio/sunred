name: Go

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io

jobs:
  docker-build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sunred-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/api/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-v2
          cache-to: type=gha,scope=api-v2,mode=max

  docker-build-relay:
    name: Build & Push Relay Docker
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sunred-relay
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: go/relay/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sunred
          POSTGRES_PASSWORD: sunred
          POSTGRES_DB: sunred
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sunred -d sunred"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SUNRED_DATABASE_URL: postgres://sunred:sunred@localhost:5432/sunred?sslmode=disable
      RELAY_DATABASE_URL: postgres://sunred:sunred@localhost:5432/sunred_relay_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Create relay test database
        run: |
          psql "$SUNRED_DATABASE_URL" -c "CREATE DATABASE sunred_relay_test;" \
            || echo "sunred_relay_test already exists"

      - name: Lint API
        working-directory: go/api
        run: make lint

      - name: Lint Relay
        working-directory: go/relay
        run: make lint

      - name: Vet SDK
        working-directory: go/sdk
        run: go vet ./...

      - name: Vet CLI
        working-directory: go/cli
        run: go vet ./...

      - name: Test API (coverage)
        working-directory: go/api
        run: make cover

      - name: Test Relay (coverage)
        working-directory: go/relay
        run: make cover

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: go/api/coverage.out
          if-no-files-found: warn

      - name: Upload Relay coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-relay
          path: go/relay/coverage.out
          if-no-files-found: warn

      - name: Build CLI
        working-directory: go/cli
        run: make build
